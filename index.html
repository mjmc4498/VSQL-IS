<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador SQL para BigQuery - Interseguro</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <div class="logo">Interseguro</div>
        <h1>Generador de SQL para Validaciones en BigQuery</h1>
    </header>
    <div class="container">
        <div class="form-grid">
            <div>
                <label for="projectSrc">Proyecto Origen:</label>
                <input id="projectSrc" type="text" placeholder="Ej: mi-proyecto-origen">
            </div>
            <div>
                <label for="projectDst">Proyecto Destino (opcional):</label>
                <input id="projectDst" type="text" placeholder="Dejar en blanco si es el mismo que origen">
            </div>
            <div>
                <label for="datasetSrc">Dataset Origen:</label>
                <input id="datasetSrc" type="text" placeholder="Ej: mi_dataset_origen">
            </div>
            <div>
                <label for="datasetDst">Dataset Destino (opcional):</label>
                <input id="datasetDst" type="text" placeholder="Dejar en blanco si es el mismo que origen">
            </div>
            <div>
                <label for="tableSrc">Tabla Origen:</label>
                <input id="tableSrc" type="text" placeholder="Ej: tabla_origen">
            </div>
            <div>
                <label for="tableDst">Tabla Destino (opcional):</label>
                <input id="tableDst" type="text" placeholder="Dejar en blanco para validar una sola tabla">
            </div>
             <div>
                <label for="filterSrc">Filtro Tabla Origen (opcional):</label>
                <input id="filterSrc" type="text" placeholder="Ej: fecha > '2023-01-01'">
            </div>
            <div>
                <label for="filterDst">Filtro Tabla Destino (opcional):</label>
                <input id="filterDst" type="text" placeholder="Ej: estado = 'activo'">
            </div>
        </div>

        <label for="fields">Campos a Comparar (separados por comas):</label>
        <input id="fields" type="text" placeholder="Ej: campo1, campo2, campo3">

        <label for="keyField">Clave Primaria (separada por comas):</label>
        <input id="keyField" type="text" placeholder="Ej: id, another_id">

        <button id="generateBtn">
            <i class="fas fa-cogs"></i>
            Generar SQLs
            <div class="loader"></div>
        </button>

        <div id="output" class="sql-output-container"></div>
    </div>

    <div id="notification" class="notification"></div>

    <script src="js/script.js"></script>
</body>
</html>
